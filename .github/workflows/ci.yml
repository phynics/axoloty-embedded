name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hardware-free gate. It needs no toolchain, so it is the one check
      # that is always required and always fast.
      - name: Check invariants
        run: Tools/verify.sh --tier repo --require repo

      - name: Check scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck Tools/*.sh Profiles/*/*.sh 2>/dev/null || shellcheck Tools/*.sh

  core:
    name: Locked Core preparation
    runs-on: ubuntu-latest
    needs: repo
    # The Core manifests are swift-tools-version 6.4, and the release list
    # setup-swift bundles stops at 6.2.1. Run the job in the documented CI
    # base instead, the same way a developer prepares Core locally.
    container: swift:6.4-jammy
    env:
      # Axoloty's tooling selects its Linux execution context from this
      # variable. Unset, it takes its host path and preparation fails with a
      # misleading canonical-checkout error; prepare-core.sh refuses rather
      # than let that happen. See docs/container-builds.md section 1.
      AXOLOTY_DEVCONTAINER: "1"
    steps:
      - uses: actions/checkout@v4

      # CI sets CI, so prepare-core.sh is strict by default: a dirty or
      # off-lock Core checkout is an error here, never a warning.
      - name: Prepare Core at the locked revision
        run: Tools/verify.sh --tier core --require core

      - name: Publish the preparation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-preparation
          path: .axoloty/core-preparation.json
          if-no-files-found: warn

  build:
    name: Firmware host checks and image
    runs-on: ubuntu-latest
    needs: [repo, core]
    container: swift:6.4-jammy
    env:
      # The build job prepares its own report because Core reports contain
      # absolute paths in this job's workspace; the report artifact from the
      # separate core job cannot be reused as a host-test input.
      AXOLOTY_DEVCONTAINER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out repository in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install host test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq build-essential clang cmake ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y -qq nodejs

      # Prepare the locked Core checkout in this job. The host checks need the
      # real generated module map and facade header, and those paths are local
      # to this workspace rather than portable in the core-job artifact.
      - name: Prepare Core for host checks
        run: Tools/verify.sh --tier core --require core

      # The build tier runs the hardware-free host firmware checks and then
      # attempts each profile image build. This runner has no ESP-IDF image, so
      # the image build reports UNAVAILABLE, which is honest and never a pass.
      #
      # Each host check below is named in --require. Without a requirement an
      # absent toolchain turns a check into a SKIP and the run stays green, which
      # is how this job reported success while the Zenoh seam, the report
      # contract, the CMake escape check and the host smoke test had never run.
      # `--require build` is deliberately absent: it would demand a firmware
      # image, so the job could never be green on a runner without ESP-IDF. The
      # image stays an explicit SKIP.
      - name: Host firmware checks
        run: >-
          Tools/verify.sh --tier build
          --require build:runtime-identity
          --require build:shared-flags
          --require build:mqtt-host-seam
          --require build:profile-isolation
          --require build:unsupported-validator
          --require build:zenoh-host-seam
          --require build:zenoh-report-contract
          --require build:cmake-escape
          --require build:host-smoke

      # The broker tier self-provisions an ephemeral in-process broker when no
      # operator broker is configured. It needs no board or container broker.
      - name: Broker-only checks
        run: Tools/verify.sh --tier broker

# The device tier is deliberately absent. Qualification needs a board, runs on
# a bench, and is recorded as an evidence record under docs/evidence/. CI never
# claims a device result it did not observe.
