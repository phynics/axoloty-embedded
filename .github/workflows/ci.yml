name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hardware-free gate. It needs no toolchain, so it is the one check
      # that is always required and always fast.
      - name: Check invariants
        run: Tools/verify.sh --tier repo --require repo

      - name: Check scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck Tools/*.sh Profiles/*/*.sh 2>/dev/null || shellcheck Tools/*.sh

  core:
    name: Locked Core preparation
    runs-on: ubuntu-latest
    needs: repo
    # The Core manifests are swift-tools-version 6.4, and the release list
    # setup-swift bundles stops at 6.2.1. Run the job in the documented CI
    # base instead, the same way a developer prepares Core locally.
    container: swift:6.4-jammy
    env:
      # Axoloty's tooling selects its Linux execution context from this
      # variable. Unset, it takes its host path and preparation fails with a
      # misleading canonical-checkout error; prepare-core.sh refuses rather
      # than let that happen. See docs/container-builds.md section 1.
      AXOLOTY_DEVCONTAINER: "1"
    steps:
      - uses: actions/checkout@v4

      # CI sets CI, so prepare-core.sh is strict by default: a dirty or
      # off-lock Core checkout is an error here, never a warning.
      - name: Prepare Core at the locked revision
        run: Tools/verify.sh --tier core --require core

      - name: Publish the preparation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-preparation
          path: .axoloty/core-preparation.json
          if-no-files-found: warn

  build:
    name: Firmware host checks and image
    runs-on: ubuntu-latest
    needs: repo
    container: swift:6.4-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out repository in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install host test dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y -qq nodejs

      # The build tier runs the hardware-free host firmware checks (runtime
      # identity, shared flags, and the MQTT transport seam) and then attempts
      # each profile image build. This runner has no pinned ESP-IDF + Swift
      # image, so the image build reports UNAVAILABLE, which is honest and is
      # never a pass. The tier is deliberately not required: requiring it would
      # demand an ESP-IDF toolchain CI does not have.
      - name: Host firmware checks and profile image
        run: Tools/verify.sh --tier build

      # The broker tier self-provisions an ephemeral in-process broker when no
      # operator broker is configured. It needs no board or container broker.
      - name: Broker-only checks
        run: Tools/verify.sh --tier broker

# The device tier is deliberately absent. Qualification needs a board, runs on
# a bench, and is recorded as an evidence record under docs/evidence/. CI never
# claims a device result it did not observe.
